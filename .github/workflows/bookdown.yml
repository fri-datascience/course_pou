# Builds the book and deploys it to GitHub Pages as two channels:
#   /      latest -> the rendered site attached (site.zip) to the release marked "Latest"
#   /dev/  dev    -> rendered from master HEAD
#
# Promote dev to latest: publish a GitHub Release (tag on master).
# Roll back: mark an older release as "Latest", then Actions -> Run workflow.
# PRs to master only build (no deploy).

name: Build and deploy book

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]   # build only, never deploys
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # upload site.zip to releases
  pages: write
  id-token: write
  packages: read    # pull the CI image from GHCR

# Deploys share one queue; each PR gets its own group, and a new push to the PR
# cancels its previous build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # CI image with R, pandoc and all packages, tagged by a hash of .github/docker/.
  # Built only when no image exists for the current Dockerfile and DESCRIPTION; otherwise reused.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        run: echo "ref=ghcr.io/fri-datascience/course_pou-ci:${{ hashFiles('.github/docker/**', 'exercise-handbook/DESCRIPTION') }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.ref }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.ref }}

  build-latest:
    needs: image
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Render latest
        run: Rscript exercise-handbook/build.R latest _out
      - name: Attach site.zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd _out && zip -qr ../site.zip .)
          gh release upload "${{ github.event.release.tag_name }}" site.zip --clobber --repo "${{ github.repository }}"

  build-dev:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a release event, dev still comes from master HEAD, not the tag.
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
      - name: Render dev
        run: Rscript exercise-handbook/build.R dev _out
      - uses: actions/upload-artifact@v7
        with:
          name: dev-site
          path: _out
          include-hidden-files: true

  deploy:
    needs: [build-latest, build-dev]
    if: >-
      always() &&
      needs.build-dev.result == 'success' &&
      (needs.build-latest.result == 'success' || needs.build-latest.result == 'skipped') &&
      (github.event_name == 'release' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch latest release site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          if gh release download --repo "${{ github.repository }}" --pattern site.zip --dir . ; then
            unzip -q site.zip -d _site
          else
            echo "::warning::No release with site.zip found; root will redirect to /dev/ until the first release is published."
            printf '<!doctype html><meta http-equiv="refresh" content="0; url=dev/">\n' > _site/index.html
          fi
      - uses: actions/download-artifact@v8
        with:
          name: dev-site
          path: _site/dev
      - run: touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true
          # Unique per attempt, so "Re-run failed jobs" doesn't find two artifacts.
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
